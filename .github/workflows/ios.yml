name: ios
# Builds the unsigned Oracles.ipa (for SideStore / AltStore to sign) on a Mac runner, so an IPA
# can be had without a Mac at hand. Download it from the run's Artifacts.
on:
  push:
    branches: [ios-port]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # to replace the ios-latest release

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build IPA
        run: ios/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Oracles-ipa
          path: Oracles.ipa
          retention-days: 14
      # A fixed release whose Oracles.ipa is always the newest build: one link to tap on the phone.
      - name: Publish ios-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios-latest --yes --cleanup-tag || true
          gh release create ios-latest Oracles.ipa --prerelease --target "$GITHUB_SHA" \
            --title "iOS build ${GITHUB_SHA::7}" --notes "Unsigned; open in SideStore or AltStore."
